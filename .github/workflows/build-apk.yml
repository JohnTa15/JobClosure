name: Build debug APK and desktop app

on:
  push:
    branches:
      - '**'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Compute version (matches the number Gradle baked into the APK)
        id: version
        run: |
          VERSION_NAME="1.0.${{ github.run_number }}"
          RENAMED="app-debug-v${VERSION_NAME}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/${RENAMED}"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "renamed_apk=app/build/outputs/apk/debug/${RENAMED}" >> "$GITHUB_OUTPUT"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: jobclosure-android-apk
          path: ${{ steps.version.outputs.renamed_apk }}

  build-desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Package Windows installer (.msi)
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: ./gradlew.bat :desktopApp:packageDistributionForCurrentOS --stacktrace

      # jpackage/WiX only write their actual error text to log files on the runner's disk -
      # Gradle's own output just says "exit code 1" and points at these paths. Print them here so
      # a packaging failure is diagnosable from the Actions log instead of disappearing with the
      # ephemeral workspace.
      - name: Show jpackage logs on failure
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem -Path desktopApp/build/compose/logs -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "----- $($_.FullName) -----"
            Get-Content $_.FullName -ErrorAction Continue
          }

      - name: Upload .msi as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: jobclosure-windows-msi
          path: desktopApp/build/compose/binaries/main/msi/*.msi

  # Temporarily disabled - macOS/iOS builds paused for now, revisit later.
  build-desktop-macos:
    if: false
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Package macOS installer (.dmg)
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: ./gradlew :desktopApp:packageDistributionForCurrentOS --stacktrace

      - name: Show jpackage logs on failure
        if: failure()
        run: |
          find desktopApp/build/compose/logs -type f 2>/dev/null | while read -r f; do
            echo "----- $f -----"
            cat "$f"
          done

      - name: Upload .dmg as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: jobclosure-macos-dmg
          path: desktopApp/build/compose/binaries/main/dmg/*.dmg

  build-desktop-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Package Linux installer (.deb)
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: ./gradlew :desktopApp:packageDistributionForCurrentOS --stacktrace

      - name: Show jpackage logs on failure
        if: failure()
        run: |
          find desktopApp/build/compose/logs -type f 2>/dev/null | while read -r f; do
            echo "----- $f -----"
            cat "$f"
          done

      - name: Upload .deb as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: jobclosure-linux-deb
          path: desktopApp/build/compose/binaries/main/deb/*.deb

  # Kotlin/Native's Apple targets can only compile on a macOS host, and this sandbox has no way to
  # touch them at all - this is the only place :shared's iOS targets ever actually get built.
  # Compile-only for now (no iOS app exists yet to package); not part of publish-release's needs,
  # since it produces no release artifact.
  build-ios-shared:
    if: false
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile :shared for iOS Simulator (arm64)
        run: ./gradlew :shared:compileKotlinIosSimulatorArm64 --stacktrace

  # Runs after the platform builds and does the actual GitHub Release publishing once - avoids the
  # jobs racing to create/update the same "debug-latest" release.
  #
  # Only the Android build is required. The desktop jobs fetch third-party tooling at build time
  # (WiX for the .msi, the Gradle distribution itself) and those downloads fail often enough that
  # requiring them held the APK hostage to an unrelated outage - the phone is the primary target and
  # its build had already succeeded. Whichever installers did build still get attached; the ones
  # that didn't are simply missing from this release and return on the next green run.
  publish-release:
    needs: [build-android, build-desktop-windows, build-desktop-linux]
    if: always() && needs.build-android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Compute version
        id: version
        run: echo "version_name=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # Each build's assets get a version-specific filename so a phone/browser/desktop that
      # already downloaded a previous build never mistakes it for "already have this one" and
      # reopens a stale copy instead of fetching the new one. This step deletes whatever asset(s)
      # are already attached to the rolling "debug-latest" release first, so the release still
      # ends up with exactly one of each file instead of accumulating every past build.
      - name: Remove previous release asset(s)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view debug-latest --repo "${{ github.repository }}" --json assets \
            --jq '.assets[].name' 2>/dev/null | while read -r name; do
            gh release delete-asset debug-latest "$name" --repo "${{ github.repository }}" -y || true
          done || true

      # Workflow artifacts aren't downloadable from the official GitHub mobile app, so also
      # publish everything as Release assets - those download fine from the app and from a browser.
      - name: Publish APK + installers as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # A platform whose build failed contributes no file here, and that must not fail the
          # release - see this job's `if` above.
          fail_on_unmatched_files: false
          tag_name: debug-latest
          name: "JobClosure debug v${{ steps.version.outputs.version_name }}"
          body: |
            Έκδοση ${{ steps.version.outputs.version_name }} (build #${{ github.run_number }})
            Auto-built από το push `${{ github.sha }}` στο branch `${{ github.ref_name }}`.

            - Android: αρχείο .apk
            - Windows: αρχείο .msi
            - Linux: αρχείο .deb
          files: |
            release-assets/jobclosure-android-apk/*.apk
            release-assets/jobclosure-windows-msi/*.msi
            release-assets/jobclosure-linux-deb/*.deb
